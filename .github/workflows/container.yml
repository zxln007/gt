name: container build and push

on:
  push:
    branches: [ "*" ]
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
    inputs:
      use_prebuilt_msquic:
        description: "Download prebuilt msquic archives instead of building msquic from source"
        required: false
        default: false
        type: boolean
      msquic_prebuilt_base_url:
        description: "Base URL containing msquic-<target>.tar.gz archives"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  WITH_OFFICIAL_WEBRTC: 1
  MSQUIC_ARTIFACT_TARGETS: x86_64-linux-gnu aarch64-linux-gnu riscv64-linux-gnu
  USE_PREBUILT_MSQUIC: ${{ github.event.inputs.use_prebuilt_msquic || 'false' }}
  MSQUIC_PREBUILT_BASE_URL: ${{ github.event.inputs.msquic_prebuilt_base_url || '' }}

