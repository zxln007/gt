  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: clean-space
        run: |-
          sudo swapoff -a
          sudo rm -rf /swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean
          sudo df -Th
      # steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync WebRTC Dependencies
        run: |-
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH=$PWD/depot_tools:$PATH
          echo "$PWD/depot_tools" >> $GITHUB_PATH
          cd libcs/dep/_google-webrtc
          gclient config --spec 'solutions = [ { "name": "src", "url": "https://webrtc.googlesource.com/src.git", "managed": False, "custom_deps": {}, }, ]'
          gclient sync --nohooks --no-history --shallow
          mkdir -p src/build/util
          echo "$(date +%s)" > src/build/util/LASTCHANGE.committime
          echo "LASTCHANGE=d0c0fbd3" > src/build/util/LASTCHANGE

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'

      - name: Download prebuilt msquic artifacts
        if: env.USE_PREBUILT_MSQUIC == 'true'
        run: |-
          if [ -z "$MSQUIC_PREBUILT_BASE_URL" ]; then
            echo "MSQUIC_PREBUILT_BASE_URL is required when USE_PREBUILT_MSQUIC=true"
            exit 1
          fi
          for target in $MSQUIC_ARTIFACT_TARGETS; do
            archive="msquic-${target}.tar.gz"
            url="${MSQUIC_PREBUILT_BASE_URL%/}/${archive}"
            dest="libcs/prebuilt/msquic/${target}"
            echo "Downloading ${url}"
            mkdir -p "$dest"
            curl -fL "$url" -o "/tmp/${archive}"
            tar -xzf "/tmp/${archive}" -C "$dest"
          done

      - name: package-gt
        run: |-
          sudo apt-get update && sudo apt-get install make git gn ninja-build python3 python3-pip libgtk-3-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-x86-64-linux-gnu g++-x86-64-linux-gnu gcc-riscv64-linux-gnu g++-riscv64-linux-gnu rustc upx -y
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu riscv64gc-unknown-linux-gnu
          MAKE_ARGS=""
          if [ "$USE_PREBUILT_MSQUIC" = "true" ]; then
            MAKE_ARGS="MSQUIC_MODE=prebuilt"
          fi
          make $MAKE_ARGS

      - name: Archive GT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gt-linux
          path: |
            release/*
      - name: clean-space
        run: sudo rm -rf /home/runner/work/gt/gt/libcs/dep

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v2

      - run: echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
        shell: bash

      - name: Inspect builder
        run: |
          echo "Name:      ${{ steps.buildx.outputs.name }}"
          echo "Endpoint:  ${{ steps.buildx.outputs.endpoint }}"
          echo "Status:    ${{ steps.buildx.outputs.status }}"
          echo "Flags:     ${{ steps.buildx.outputs.flags }}"
          echo "Platforms: ${{ steps.buildx.outputs.platforms }}"

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Server
        id: meta-server
        uses: docker/metadata-action@v2
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            prefix=server-

      - name: Build and push Docker image for Server
        id: build-and-push-server
        uses: docker/build-push-action@v4.2.1
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64 #,linux/riscv64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile-server
          provenance: false

      - name: Extract Docker metadata for Client
        id: meta-client
        uses: docker/metadata-action@v2
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            prefix=client-

      - name: Build and push Docker image for Client
        id: build-and-push-client
        uses: docker/build-push-action@v4.2.1
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64 #,linux/riscv64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile-client
          provenance: false

