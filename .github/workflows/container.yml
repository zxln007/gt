name: container build and push

on:
  push:
    branches: [ "*" ]
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
    inputs:
      use_prebuilt_msquic:
        description: "Download prebuilt msquic archives instead of building msquic from source"
        required: false
        default: true
        type: boolean
      msquic_release_tag:
        description: "Release tag containing prebuilt msquic archives"
        required: false
        default: msquic-prebuilt
        type: string
      use_prebuilt_webrtc:
        description: "Download prebuilt WebRTC archives instead of building WebRTC from source"
        required: false
        default: true
        type: boolean
      webrtc_release_tag:
        description: "Release tag containing prebuilt WebRTC archives"
        required: false
        default: webrtc-prebuilt
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  WITH_OFFICIAL_WEBRTC: 1
  USE_PREBUILT_MSQUIC: ${{ github.event_name == 'pull_request' && 'true' || github.event.inputs.use_prebuilt_msquic || 'true' }}
  MSQUIC_RELEASE_TAG: ${{ github.event.inputs.msquic_release_tag || 'msquic-prebuilt' }}
  USE_PREBUILT_WEBRTC: ${{ github.event_name == 'pull_request' && 'true' || github.event.inputs.use_prebuilt_webrtc || 'true' }}
  WEBRTC_RELEASE_TAG: ${{ github.event.inputs.webrtc_release_tag || 'webrtc-prebuilt' }}

jobs:

  # =========================================================================
  # 1. Parallel Decoupled Build Job
  # =========================================================================
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux AMD64
          - target: x86_64-linux-gnu
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
            binary_suffix: linux-x86_64
            gcc_pkg: gcc-x86-64-linux-gnu g++-x86-64-linux-gnu binutils-x86-64-linux-gnu
            arch: amd64
            build_desktop: false

          # Linux ARM64
          - target: aarch64-linux-gnu
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
            binary_suffix: linux-aarch64
            gcc_pkg: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
            arch: arm64
            build_desktop: false

          # Linux RISCV64
          - target: riscv64-linux-gnu
            os: ubuntu-latest
            goos: linux
            goarch: riscv64
            rust_target: riscv64gc-unknown-linux-gnu
            binary_suffix: linux-riscv64
            gcc_pkg: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu binutils-riscv64-linux-gnu
            arch: riscv64
            build_desktop: false

          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            goos: darwin
            goarch: amd64
            rust_target: x86_64-apple-darwin
            binary_suffix: macos-x86_64
            arch: amd64
            build_desktop: true

          # macOS ARM64
          - target: aarch64-apple-darwin
            os: macos-latest
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
            binary_suffix: macos-aarch64
            arch: arm64
            build_desktop: true

          # Windows AMD64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc
            binary_suffix: windows-amd64
            arch: amd64
            build_desktop: true

    steps:
      - name: clean-space
        if: runner.os == 'Linux'
        run: |-
          sudo swapoff -a
          sudo rm -rf /swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean
          sudo df -Th

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'

      - name: Set up Rust toolchain
        run: |-
          rustup target add ${{ matrix.rust_target }}

      - name: Install system build dependencies
        if: runner.os == 'Linux'
        run: |-
          sudo apt-get update
          sudo apt-get install -y make git gn ninja-build python3 python3-pip libgtk-3-dev gcc rustc upx \
            ${{ matrix.gcc_pkg }}

      # ---------------------------------------------------------------------
      # 2. Self-Healing MSQuic Prebuilt Resolution
      # ---------------------------------------------------------------------
      - name: Resolve msquic source/prebuilt
        id: msquic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |-
          if [ "$USE_PREBUILT_MSQUIC" != "true" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p /tmp/msquic-download
          rm -rf core/prebuilt/msquic/${{ matrix.target }}
          if gh release download "$MSQUIC_RELEASE_TAG" --pattern "msquic-${{ matrix.target }}.tar.gz" --dir /tmp/msquic-download --clobber; then
            echo "Prebuilt msquic found on Release!"
            mkdir -p "core/prebuilt/msquic/${{ matrix.target }}"
            tar -xzf "/tmp/msquic-download/msquic-${{ matrix.target }}.tar.gz" -C "core/prebuilt/msquic/${{ matrix.target }}"
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
          else
            echo "Prebuilt msquic not found on Release. Falling back to build mode and will publish it afterwards."
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # 3. Self-Healing WebRTC Prebuilt Resolution
      # ---------------------------------------------------------------------
      - name: Resolve webrtc source/prebuilt
        id: webrtc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |-
          if [ "$USE_PREBUILT_WEBRTC" != "true" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p /tmp/webrtc-download
          rm -rf core/prebuilt/webrtc/${{ matrix.target }}
          if gh release download "$WEBRTC_RELEASE_TAG" --pattern "webrtc-${{ matrix.target }}.tar.gz" --dir /tmp/webrtc-download --clobber; then
            echo "Prebuilt WebRTC found on Release!"
            mkdir -p "core/prebuilt/webrtc/${{ matrix.target }}"
            tar -xzf "/tmp/webrtc-download/webrtc-${{ matrix.target }}.tar.gz" -C "core/prebuilt/webrtc/${{ matrix.target }}"
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
          else
            echo "Prebuilt WebRTC not found on Release. Falling back to build mode and will publish it afterwards."
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # 4. Git Depot-Tools Checkout (Only on cache miss for WebRTC)
      # ---------------------------------------------------------------------
      - name: Sync WebRTC Dependencies
        shell: bash
        run: |-
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH=$PWD/depot_tools:$PATH
          echo "$PWD/depot_tools" >> $GITHUB_PATH
          cd core/dep/_google-webrtc
          gclient config --spec 'solutions = [ { "name": "src", "url": "https://webrtc.googlesource.com/src.git", "managed": False, "custom_deps": {}, }, ]'
          gclient sync --nohooks --no-history --shallow
          mkdir -p src/build/util
          echo "$(date +%s)" > src/build/util/LASTCHANGE.committime
          echo "LASTCHANGE=d0c0fbd3" > src/build/util/LASTCHANGE

      # ---------------------------------------------------------------------
      # 5. Build and Publish msquic Prebuilt (On Cache Miss Only)
      # ---------------------------------------------------------------------
      - name: Build & Publish msquic Prebuilt
        if: steps.msquic.outputs.mode == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |-
          cd core
          make build_msquic TARGET=${{ matrix.target }} MSQUIC_MODE=build
          
          artifact_root="$RUNNER_TEMP/msquic-${{ matrix.target }}"
          mkdir -p "$artifact_root/include" "$artifact_root/lib"
          cp -a dep/_msquic/src/inc/. "$artifact_root/include/"
          cp "dep/_msquic/out/${{ matrix.target }}/bin/Release/libmsquic.a" "$artifact_root/lib/"
          cat > "$artifact_root/metadata.json" <<EOF
          {
            "name": "msquic",
            "artifact_version": 1,
            "target": "${{ matrix.target }}",
            "os": "linux",
            "arch": "${{ matrix.arch }}",
            "library_type": "static",
            "rename_symbols_applied": true,
            "msquic_commit": "$(git -C dep/_msquic rev-parse HEAD)",
            "built_by": "github-actions"
          }
          EOF
          tar -C "$artifact_root" -czf "$RUNNER_TEMP/msquic-${{ matrix.target }}.tar.gz" .
          
          # Ensure release tag exists and upload asset
          gh release view "$MSQUIC_RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$MSQUIC_RELEASE_TAG" --title "$MSQUIC_RELEASE_TAG" --notes "Prebuilt msquic artifacts"
          gh release upload "$MSQUIC_RELEASE_TAG" "$RUNNER_TEMP/msquic-${{ matrix.target }}.tar.gz" --clobber

      # ---------------------------------------------------------------------
      # 6. Build and Publish WebRTC Prebuilt (On Cache Miss Only)
      # ---------------------------------------------------------------------
      - name: Build & Publish WebRTC Prebuilt
        if: steps.webrtc.outputs.mode == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |-
          cd core
          make build_webrtc TARGET=${{ matrix.target }} WEBRTC_MODE=build
          
          artifact_root="$RUNNER_TEMP/webrtc-${{ matrix.target }}"
          mkdir -p "$artifact_root/lib"
          cp "dep/_google-webrtc/src/out/release-${{ matrix.target }}/obj/libwebrtc.a" "$artifact_root/lib/"
          cat > "$artifact_root/metadata.json" <<EOF
          {
            "name": "webrtc",
            "artifact_version": 1,
            "target": "${{ matrix.target }}",
            "os": "linux",
            "arch": "${{ matrix.arch }}",
            "library_type": "static",
            "webrtc_commit": "$(git -C dep/_google-webrtc/src rev-parse HEAD)",
            "built_by": "github-actions"
          }
          EOF
          tar -C "$artifact_root" -czf "$RUNNER_TEMP/webrtc-${{ matrix.target }}.tar.gz" .
          
          # Ensure release tag exists and upload asset
          gh release view "$WEBRTC_RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$WEBRTC_RELEASE_TAG" --title "$WEBRTC_RELEASE_TAG" --notes "Prebuilt WebRTC artifacts"
          gh release upload "$WEBRTC_RELEASE_TAG" "$RUNNER_TEMP/webrtc-${{ matrix.target }}.tar.gz" --clobber

      # ---------------------------------------------------------------------
      # 7. Final GT Compilation
      # ---------------------------------------------------------------------
      - name: Compile GT single target
        shell: bash
        run: |-
          make release_target \
            TARGET=${{ matrix.target }} \
            GOOS=${{ matrix.goos }} \
            GOARCH=${{ matrix.goarch }} \
            RUST_TARGET=${{ matrix.rust_target }} \
            BINARY_SUFFIX=${{ matrix.binary_suffix }} \
            MSQUIC_MODE=${{ steps.msquic.outputs.mode }} \
            WEBRTC_MODE=${{ steps.webrtc.outputs.mode }}

      # ---------------------------------------------------------------------
      # 8. Build Wails Desktop App (Only if build_desktop is enabled)
      # ---------------------------------------------------------------------
      - name: Set up Node.js
        if: matrix.build_desktop == true
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Wails v3 CLI
        if: matrix.build_desktop == true
        shell: bash
        run: |-
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Compile & Package GT Desktop (Wails)
        if: matrix.build_desktop == true
        shell: bash
        run: |-
          # Copy compiled helper binary to desktop's bin directory
          mkdir -p desktop/bin
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp target/${{ matrix.rust_target }}/release/gt.exe desktop/bin/gt.exe
          else
            cp target/${{ matrix.rust_target }}/release/gt desktop/bin/gt
          fi

          # Build frontend assets
          cd desktop/frontend
          npm install
          npm run build
          cd ..

          # Generate wails bindings and build native desktop executable
          wails3 generate bindings
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -tags production -trimpath -ldflags="-w -s -H windowsgui" -o bin/GT-Desktop.exe
          else
            go build -tags production -trimpath -ldflags="-w -s" -o bin/GT-Desktop
          fi

      - name: Archive GT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gt-${{ matrix.binary_suffix }}
          path: |
            release/*
            desktop/bin/*

      - name: clean-space
        if: runner.os == 'Linux'
        run: sudo rm -rf /home/runner/work/gt/gt/core/dep


  # =========================================================================
  # 8. Decoupled Multi-Platform Docker Build & Push Job
  # =========================================================================
  docker-build:
    name: docker build and push
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all GT matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gt-linux-*
          path: release
          merge-multiple: true

      - name: List merged release files
        run: ls -la release/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup Docker buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - run: echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
        shell: bash

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Server
        id: meta-server
        uses: docker/metadata-action@v2
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            prefix=server-

      - name: Build and push Docker image for Server
        id: build-and-push-server
        uses: docker/build-push-action@v4.2.1
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile-server
          provenance: false

      - name: Extract Docker metadata for Client
        id: meta-client
        uses: docker/metadata-action@v2
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            prefix=client-

      - name: Build and push Docker image for Client
        id: build-and-push-client
        uses: docker/build-push-action@v4.2.1
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile-client
          provenance: false
