name: container build and push

on:
  push:
    branches: [ "*" ]
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
    inputs:
      use_prebuilt_msquic:
        description: "Download prebuilt msquic archives instead of building msquic from source"
        required: false
        default: true
        type: boolean
      msquic_release_tag:
        description: "Release tag containing prebuilt msquic archives"
        required: false
        default: msquic-prebuilt
        type: string
      use_prebuilt_webrtc:
        description: "Download prebuilt WebRTC archives instead of building WebRTC from source"
        required: false
        default: true
        type: boolean
      webrtc_release_tag:
        description: "Release tag containing prebuilt WebRTC archives"
        required: false
        default: webrtc-prebuilt
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  WITH_OFFICIAL_WEBRTC: 1
  USE_PREBUILT_MSQUIC: ${{ github.event_name == 'pull_request' && 'true' || github.event.inputs.use_prebuilt_msquic || 'true' }}
  MSQUIC_RELEASE_TAG: ${{ github.event.inputs.msquic_release_tag || 'msquic-prebuilt' }}
  USE_PREBUILT_WEBRTC: ${{ github.event_name == 'pull_request' && 'true' || github.event.inputs.use_prebuilt_webrtc || 'true' }}
  WEBRTC_RELEASE_TAG: ${{ github.event.inputs.webrtc_release_tag || 'webrtc-prebuilt' }}

jobs:

  # =========================================================================
  # 1. Parallel Decoupled Build Job
  # =========================================================================
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # # Linux AMD64
          # - target: x86_64-linux-gnu
          #   os: ubuntu-latest
          #   goos: linux
          #   goarch: amd64
          #   rust_target: x86_64-unknown-linux-gnu
          #   binary_suffix: linux-x86_64
          #   gcc_pkg: gcc-x86-64-linux-gnu g++-x86-64-linux-gnu binutils-x86-64-linux-gnu
          #   arch: amd64
          #   build_desktop: false

          # # Linux ARM64
          # - target: aarch64-linux-gnu
          #   os: ubuntu-latest
          #   goos: linux
          #   goarch: arm64
          #   rust_target: aarch64-unknown-linux-gnu
          #   binary_suffix: linux-aarch64
          #   gcc_pkg: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
          #   arch: arm64
          #   build_desktop: false

          # # Linux RISCV64
          # - target: riscv64-linux-gnu
          #   os: ubuntu-latest
          #   goos: linux
          #   goarch: riscv64
          #   rust_target: riscv64gc-unknown-linux-gnu
          #   binary_suffix: linux-riscv64
          #   gcc_pkg: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu binutils-riscv64-linux-gnu
          #   arch: riscv64
          #   build_desktop: false

          # # macOS Intel
          # - target: x86_64-apple-darwin
          #   os: macos-latest
          #   goos: darwin
          #   goarch: amd64
          #   rust_target: x86_64-apple-darwin
          #   binary_suffix: macos-x86_64
          #   arch: amd64
          #   build_desktop: true

          # # macOS ARM64
          # - target: aarch64-apple-darwin
          #   os: macos-latest
          #   goos: darwin
          #   goarch: arm64
          #   rust_target: aarch64-apple-darwin
          #   binary_suffix: macos-aarch64
          #   arch: arm64
          #   build_desktop: true

          # Windows AMD64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc
            binary_suffix: windows-amd64
            arch: amd64
            build_desktop: true

    steps:
      - name: clean-space
        if: runner.os == 'Linux'
        run: |-
          sudo swapoff -a
          sudo rm -rf /swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean
          sudo df -Th

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.10'

      - name: Show Go version
        run: go version

      - name: Set up Rust toolchain
        run: |-
          rustup target add ${{ matrix.rust_target }}

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fix GNU link clash on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f /usr/bin/link.exe

      - name: Set up .NET (Windows only)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up CMake (Windows only)
        if: runner.os == 'Windows'
        uses: jwlawson/actions-setup-cmake@v2

      - name: Install system build dependencies
        if: runner.os == 'Linux'
        run: |-
          sudo apt-get update
          sudo apt-get install -y make git gn ninja-build python3 python3-pip libgtk-3-dev gcc rustc upx \
            ${{ matrix.gcc_pkg }}

      # ---------------------------------------------------------------------
      # 2. Self-Healing MSQuic Prebuilt Resolution
      # ---------------------------------------------------------------------
      - name: Resolve msquic source/prebuilt
        id: msquic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |-
          if [ "$USE_PREBUILT_MSQUIC" != "true" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p /tmp/msquic-download
          rm -rf core/prebuilt/msquic/${{ matrix.target }}
          if gh release download "$MSQUIC_RELEASE_TAG" --pattern "msquic-${{ matrix.target }}.tar.gz" --dir /tmp/msquic-download --clobber; then
            echo "Prebuilt msquic found on Release!"
            mkdir -p "core/prebuilt/msquic/${{ matrix.target }}"
            tar -xzf "/tmp/msquic-download/msquic-${{ matrix.target }}.tar.gz" -C "core/prebuilt/msquic/${{ matrix.target }}"
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
          else
            echo "Prebuilt msquic not found on Release. Falling back to build mode and will publish it afterwards."
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate downloaded msquic prebuilt (Windows)
        id: msquic_prebuilt_check
        if: runner.os == 'Windows' && steps.msquic.outputs.mode == 'prebuilt'
        shell: pwsh
        run: |-
          $lib = "core/prebuilt/msquic/${{ matrix.target }}/lib/msquic.lib"
          if (!(Test-Path -Path $lib)) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "valid=false"
            exit 0
          }

          $members = & dumpbin /linkermember:1 $lib 2>&1
          if ($LASTEXITCODE -ne 0) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "valid=false"
            exit 0
          }

          if (($members -match 'MsQuicOpenVersion') -and ($members -match 'MsQuicClose')) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "valid=true"
          } else {
            Write-Host "Downloaded msquic prebuilt is missing expected exports; falling back to source build."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "valid=false"
          }

      # ---------------------------------------------------------------------
      # 3. Self-Healing WebRTC Prebuilt Resolution
      # ---------------------------------------------------------------------
      - name: Resolve webrtc source/prebuilt
        id: webrtc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |-
          if [ "$USE_PREBUILT_WEBRTC" != "true" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p /tmp/webrtc-download
          rm -rf core/prebuilt/webrtc/${{ matrix.target }}
          if gh release download "$WEBRTC_RELEASE_TAG" --pattern "webrtc-${{ matrix.target }}.tar.gz" --dir /tmp/webrtc-download --clobber; then
            echo "Prebuilt WebRTC found on Release!"
            mkdir -p "core/prebuilt/webrtc/${{ matrix.target }}"
            tar -xzf "/tmp/webrtc-download/webrtc-${{ matrix.target }}.tar.gz" -C "core/prebuilt/webrtc/${{ matrix.target }}"
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
          else
            echo "Prebuilt WebRTC not found on Release. Falling back to build mode and will publish it afterwards."
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # 4. Git Depot-Tools Checkout (Only on cache miss for WebRTC)
      # ---------------------------------------------------------------------
      - name: Sync WebRTC Dependencies
        shell: bash
        run: |-
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH=$PWD/depot_tools:$PATH
          echo "$PWD/depot_tools" >> $GITHUB_PATH
          cd core/dep/_google-webrtc
          gclient config --spec 'solutions = [ { "name": "src", "url": "https://webrtc.googlesource.com/src.git", "managed": False, "custom_deps": {}, }, ]'
          gclient sync --nohooks --no-history --shallow
          mkdir -p src/build/util
          echo "$(date +%s)" > src/build/util/LASTCHANGE.committime
          echo "LASTCHANGE=d0c0fbd3" > src/build/util/LASTCHANGE

      # ---------------------------------------------------------------------
      # 5. Build and Publish msquic Prebuilt (On Cache Miss Only)
      # ---------------------------------------------------------------------
      - name: Build & Publish msquic Prebuilt (Unix)
        if: steps.msquic.outputs.mode == 'build' && runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |-
          cd core
          make build_msquic TARGET=${{ matrix.target }} MSQUIC_MODE=build
          
          artifact_root="$RUNNER_TEMP/msquic-${{ matrix.target }}"
          mkdir -p "$artifact_root/include" "$artifact_root/lib"
          cp -a dep/_msquic/src/inc/. "$artifact_root/include/"
          cp "dep/_msquic/out/${{ matrix.target }}/bin/Release/libmsquic.a" "$artifact_root/lib/"
          cat > "$artifact_root/metadata.json" <<EOF
          {
            "name": "msquic",
            "artifact_version": 1,
            "target": "${{ matrix.target }}",
            "os": "${{ matrix.goos }}",
            "arch": "${{ matrix.arch }}",
            "library_type": "static",
            "rename_symbols_applied": true,
            "msquic_commit": "$(git -C dep/_msquic rev-parse HEAD)",
            "built_by": "github-actions"
          }
          EOF
          tar -C "$artifact_root" -czf "$RUNNER_TEMP/msquic-${{ matrix.target }}.tar.gz" .
          
          # Ensure release tag exists and upload asset
          gh release view "$MSQUIC_RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$MSQUIC_RELEASE_TAG" --title "$MSQUIC_RELEASE_TAG" --notes "Prebuilt msquic artifacts"
          gh release upload "$MSQUIC_RELEASE_TAG" "$RUNNER_TEMP/msquic-${{ matrix.target }}.tar.gz" --clobber

      - name: Build & Publish msquic Prebuilt (Windows)
        if: runner.os == 'Windows' && (steps.msquic.outputs.mode == 'build' || steps.msquic_prebuilt_check.outputs.valid != 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |-
          $WORK_DIR = Get-Location
          $MSQUIC_DIR = "$WORK_DIR/core/dep/_msquic"
          $MSQUIC_OUT_DIR = "$MSQUIC_DIR/artifacts/bin/windows/x64_Release_schannel"
          
          Set-Location $MSQUIC_DIR
          Write-Host "Preparing msquic environment"
          if (!(Test-Path -Path "$MSQUIC_DIR/artifacts")){
            &./scripts/prepare-machine.ps1
          }
          Write-Host "msquic开始编译"
          &./scripts/build.ps1 -Config Release -Clean -Static -DisableTest -DisableTools -StaticCRT
          if (-not (Test-Path -Path "$MSQUIC_OUT_DIR/msquic.lib")) {
            Write-Error "msquic编译失败"
            exit 1
          }
          
          Set-Location $WORK_DIR
          $artifact_root = "$env:RUNNER_TEMP/msquic-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "$artifact_root/include"
          New-Item -ItemType Directory -Force -Path "$artifact_root/lib"
          Copy-Item -Path "core/dep/_msquic/src/inc/*" -Destination "$artifact_root/include/" -Recurse -Force
          Copy-Item -Path "$MSQUIC_OUT_DIR/msquic.lib" -Destination "$artifact_root/lib/"
          $prebuilt_root = "core/prebuilt/msquic/${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "$prebuilt_root/include"
          New-Item -ItemType Directory -Force -Path "$prebuilt_root/lib"
          Copy-Item -Path "core/dep/_msquic/src/inc/*" -Destination "$prebuilt_root/include/" -Recurse -Force
          Copy-Item -Path "$MSQUIC_OUT_DIR/msquic.lib" -Destination "$prebuilt_root/lib/"
          
          $commit = git -C core/dep/_msquic rev-parse HEAD
          $metadata = @{
            name = "msquic"
            artifact_version = 1
            target = "${{ matrix.target }}"
            os = "windows"
            arch = "${{ matrix.arch }}"
            library_type = "static"
            rename_symbols_applied = $false
            msquic_commit = $commit
            built_by = "github-actions"
          } | ConvertTo-Json
          $metadata | Out-File -FilePath "$artifact_root/metadata.json" -Encoding utf8
          $metadata | Out-File -FilePath "$prebuilt_root/metadata.json" -Encoding utf8
          
          tar -C "$artifact_root" -czf "$env:RUNNER_TEMP/msquic-${{ matrix.target }}.tar.gz" .
          
          gh release view "$env:MSQUIC_RELEASE_TAG" >$null 2>&1
          if ($LastExitCode -ne 0) {
            gh release create "$env:MSQUIC_RELEASE_TAG" --title "$env:MSQUIC_RELEASE_TAG" --notes "Prebuilt msquic artifacts"
          }
          gh release upload "$env:MSQUIC_RELEASE_TAG" "$env:RUNNER_TEMP/msquic-${{ matrix.target }}.tar.gz" --clobber

      # ---------------------------------------------------------------------
      # 6. Build and Publish WebRTC Prebuilt (On Cache Miss Only)
      # ---------------------------------------------------------------------
      - name: Build & Publish WebRTC Prebuilt (Unix)
        if: steps.webrtc.outputs.mode == 'build' && runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |-
          cd core
          make build_webrtc TARGET=${{ matrix.target }} WEBRTC_MODE=build
          
          artifact_root="$RUNNER_TEMP/webrtc-${{ matrix.target }}"
          mkdir -p "$artifact_root/lib"
          cp "dep/_google-webrtc/src/out/release-${{ matrix.target }}/obj/libwebrtc.a" "$artifact_root/lib/"
          cat > "$artifact_root/metadata.json" <<EOF
          {
            "name": "webrtc",
            "artifact_version": 1,
            "target": "${{ matrix.target }}",
            "os": "${{ matrix.goos }}",
            "arch": "${{ matrix.arch }}",
            "library_type": "static",
            "webrtc_commit": "$(git -C dep/_google-webrtc/src rev-parse HEAD)",
            "built_by": "github-actions"
          }
          EOF
          tar -C "$artifact_root" -czf "$RUNNER_TEMP/webrtc-${{ matrix.target }}.tar.gz" .
          
          # Ensure release tag exists and upload asset
          gh release view "$WEBRTC_RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$WEBRTC_RELEASE_TAG" --title "$WEBRTC_RELEASE_TAG" --notes "Prebuilt WebRTC artifacts"
          gh release upload "$WEBRTC_RELEASE_TAG" "$RUNNER_TEMP/webrtc-${{ matrix.target }}.tar.gz" --clobber

      - name: Build & Publish WebRTC Prebuilt (Windows)
        if: steps.webrtc.outputs.mode == 'build' && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |-
          $WORK_DIR = Get-Location
          $WEBRTC_DIR = "$WORK_DIR/core/dep/_google-webrtc"
          $WEBRTC_OUT_DIR = "$WEBRTC_DIR/src/out/release/obj"
          
          $vsPath = ""
          $vsWherePath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsWherePath) {
              $vsPath = & $vsWherePath -latest -property installationPath
          }
          if (-not $vsPath) {
              $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Community"
          }
          $env:PATH += ";$vsPath\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
          $env:DEPOT_TOOLS_WIN_TOOLCHAIN = "0"
          $env:GYP_GENERATORS = "msvs-ninja,ninja"
          $env:GYP_MSVS_OVERRIDE_PATH = $vsPath
          $env:GYP_MSVS_VERSION = "2022"
          
          python3 "$WEBRTC_DIR/src/tools/clang/scripts/update.py"
          
          Set-Location "$WEBRTC_DIR/src"
          gn gen out/release --args="clang_use_chrome_plugins=false is_clang=true enable_libaom=false is_component_build=false is_debug=false libyuv_disable_jpeg=true libyuv_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_grpc=false rtc_enable_protobuf=false rtc_include_builtin_audio_codecs=false rtc_include_dav1d_in_internal_decoder_factory=false rtc_include_ilbc=false rtc_include_internal_audio_device=false rtc_include_tests=false rtc_use_h264=false rtc_use_x11=false treat_warnings_as_errors=false use_custom_libcxx=false use_gold=false use_lld=true use_rtti=true use_sysroot=false"
          ninja -C out/release
          if (-not (Test-Path -Path "$WEBRTC_OUT_DIR/webrtc.lib")) {
            Write-Error "webrtc编译失败"
            exit 1
          }
          
          Set-Location $WORK_DIR
          $artifact_root = "$env:RUNNER_TEMP/webrtc-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "$artifact_root/lib"
          Copy-Item -Path "$WEBRTC_OUT_DIR/webrtc.lib" -Destination "$artifact_root/lib/"
          $prebuilt_root = "core/prebuilt/webrtc/${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "$prebuilt_root/lib"
          Copy-Item -Path "$WEBRTC_OUT_DIR/webrtc.lib" -Destination "$prebuilt_root/lib/"
          
          $commit = git -C "$WEBRTC_DIR/src" rev-parse HEAD
          $metadata = @{
            name = "webrtc"
            artifact_version = 1
            target = "${{ matrix.target }}"
            os = "windows"
            arch = "${{ matrix.arch }}"
            library_type = "static"
            webrtc_commit = $commit
            built_by = "github-actions"
          } | ConvertTo-Json
          $metadata | Out-File -FilePath "$artifact_root/metadata.json" -Encoding utf8
          $metadata | Out-File -FilePath "$prebuilt_root/metadata.json" -Encoding utf8
          
          tar -C "$artifact_root" -czf "$env:RUNNER_TEMP/webrtc-${{ matrix.target }}.tar.gz" .
          
          gh release view "$env:WEBRTC_RELEASE_TAG" >$null 2>&1
          if ($LastExitCode -ne 0) {
            gh release create "$env:WEBRTC_RELEASE_TAG" --title "$env:WEBRTC_RELEASE_TAG" --notes "Prebuilt WebRTC artifacts"
          }
          gh release upload "$env:WEBRTC_RELEASE_TAG" "$env:RUNNER_TEMP/webrtc-${{ matrix.target }}.tar.gz" --clobber

      # ---------------------------------------------------------------------
      # 7. Final GT Compilation
      # ---------------------------------------------------------------------
      - name: Compile GT single target (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          EFFECTIVE_MSQUIC_MODE: ${{ runner.os == 'Windows' && 'prebuilt' || steps.msquic.outputs.mode }}
          EFFECTIVE_WEBRTC_MODE: ${{ runner.os == 'Windows' && 'prebuilt' || steps.webrtc.outputs.mode }}
        run: |-
          make release_target \
            TARGET=${{ matrix.target }} \
            GOOS=${{ matrix.goos }} \
            GOARCH=${{ matrix.goarch }} \
            RUST_TARGET=${{ matrix.rust_target }} \
            BINARY_SUFFIX=${{ matrix.binary_suffix }} \
            MSQUIC_MODE=$EFFECTIVE_MSQUIC_MODE \
            WEBRTC_MODE=$EFFECTIVE_WEBRTC_MODE

      - name: Build GT core library (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |-
          cd ./core && \
          TARGET=${{ matrix.target }} \
          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          RUST_TARGET=${{ matrix.rust_target }} \
          MSQUIC_MODE=prebuilt \
          WEBRTC_MODE=prebuilt \
          make release_lib

      - name: Diagnose Windows native libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |-
          $msquicLib = "core/release/windows/msquic.lib"
          $gtLib = "core/release/windows/gt.lib"

          Write-Host "=== msquic.lib file info ==="
          Get-Item $msquicLib | Format-List FullName,Length,LastWriteTime

          Write-Host "=== msquic.lib expected symbols ==="
          & dumpbin /linkermember:1 $msquicLib | Select-String 'MsQuicOpenVersion|MsQuicClose'

          Write-Host "=== gt.lib file info ==="
          Get-Item $gtLib | Format-List FullName,Length,LastWriteTime

          Write-Host "=== gt.lib members ==="
          & lib /LIST $gtLib

          Write-Host "=== gt.lib references to MsQuic symbols ==="
          & dumpbin /symbols $gtLib | Select-String 'MsQuicOpenVersion|MsQuicClose|External'

      - name: Compile GT single target (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |-
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=/VERBOSE:LIB"
          cargo build --target "${RUST_TARGET}" -r -v
          mkdir -p release
          cp "target/${RUST_TARGET}/release/gt.exe" "release/gt-${{ matrix.binary_suffix }}.exe"

      # ---------------------------------------------------------------------
      # 8. Build Wails Desktop App (Only if build_desktop is enabled)
      # ---------------------------------------------------------------------
      - name: Set up Node.js
        if: matrix.build_desktop == true
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Wails v3 CLI
        if: matrix.build_desktop == true
        shell: bash
        run: |-
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Compile & Package GT Desktop (Wails)
        if: matrix.build_desktop == true
        shell: bash
        run: |-
          # Copy compiled helper binary to desktop's bin directory
          mkdir -p desktop/bin
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp target/${{ matrix.rust_target }}/release/gt.exe desktop/bin/gt.exe
          else
            cp target/${{ matrix.rust_target }}/release/gt desktop/bin/gt
          fi

          # Skip frontend build since desktop/frontend uses pure static HTML/CSS/JS assets
          echo "Frontend has no package.json, skipping build steps"

          # Generate wails bindings and build native desktop executable
          cd desktop
          wails3 generate bindings
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -tags production -trimpath -ldflags="-w -s -H windowsgui" -o bin/GT-Desktop.exe
          else
            go build -tags production -trimpath -ldflags="-w -s" -o bin/GT-Desktop
          fi
          cd ..

      - name: Archive GT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gt-${{ matrix.binary_suffix }}
          path: |
            release/*
            desktop/bin/*

      - name: clean-space
        if: runner.os == 'Linux'
        run: sudo rm -rf /home/runner/work/gt/gt/core/dep


  # =========================================================================
  # 8. Decoupled Multi-Platform Docker Build & Push Job
  # =========================================================================
  docker-build:
    name: docker build and push
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all GT matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gt-linux-*
          path: release
          merge-multiple: true

      - name: List merged release files
        run: ls -la release/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup Docker buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - run: echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
        shell: bash

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Server
        id: meta-server
        uses: docker/metadata-action@v2
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            prefix=server-

      - name: Build and push Docker image for Server
        id: build-and-push-server
        uses: docker/build-push-action@v4.2.1
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile-server
          provenance: false

      - name: Extract Docker metadata for Client
        id: meta-client
        uses: docker/metadata-action@v2
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            prefix=client-

      - name: Build and push Docker image for Client
        id: build-and-push-client
        uses: docker/build-push-action@v4.2.1
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile-client
          provenance: false
