name: build

# Pipeline layout (reworked 2026-09):
#   push dev           -> light build: linux-x86_64 artifact only (fast daily feedback)
#   PR -> dev          -> same light build (gate strength = daily strength)
#   PR -> master       -> FULL 5-platform matrix (release gate: cross-platform
#                         compile errors surface BEFORE the merge)
#   push master        -> FULL matrix + docker images (server-master / client-master)
#   push tag v*        -> FULL matrix + docker (semver + latest) + GitHub release
#   workflow_dispatch  -> FULL matrix + docker; publishes a release when
#                         release_tag is set
#
# The plan job classifies the event into light/full scope and emits the matrix
# as JSON; build/docker/release key off needs.plan.outputs.full. Website/docs
# -only pushes are skipped via paths-ignore (tag pushes always run).
#
# Asset naming matches web/install.sh:
#   gt-{linux,macos}-{x86_64,aarch64,riscv64} / gt-win-x86_64.exe + checksums.txt

on:
  push:
    branches: [ "dev", "master" ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "dev", "master" ]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also publish binaries to this release tag (created if missing); empty = build + docker only"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  WITH_OFFICIAL_WEBRTC: 1

jobs:
  # ── classify event into light/full scope and emit the matrix JSON ──
  plan:
    name: plan build scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Full scope: release-worthy events only (master, v* tags, PRs into
          # master, manual dispatch). Light scope keeps dev pushes and PRs
          # into dev fast: a single linux-x86_64 artifact.
          is_tag=false
          case "$REF" in refs/tags/v*) is_tag=true;; esac

          full=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            full=true
          elif [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "master" ]; then
            full=true
          elif [ "$EVENT" = "push" ] && { [ "$REF" = "refs/heads/master" ] || [ "$is_tag" = true ]; }; then
            full=true
          fi

          cat > /tmp/matrix-light.json <<'EOF'
          {"include":[
            {"target":"x86_64-linux-gnu","os":"ubuntu-latest","goos":"linux","goarch":"amd64","rust_target":"x86_64-unknown-linux-gnu","binary_suffix":"linux-x86_64","gcc_pkg":"gcc-x86-64-linux-gnu g++-x86-64-linux-gnu binutils-x86-64-linux-gnu"}
          ]}
          EOF

          # NOTE: keep in sync when adding platforms. Intel macOS runners
          # (macos-13) are retired; Intel Mac users can run the aarch64 build
          # under Rosetta 2.
          cat > /tmp/matrix-full.json <<'EOF'
          {"include":[
            {"target":"x86_64-linux-gnu","os":"ubuntu-latest","goos":"linux","goarch":"amd64","rust_target":"x86_64-unknown-linux-gnu","binary_suffix":"linux-x86_64","gcc_pkg":"gcc-x86-64-linux-gnu g++-x86-64-linux-gnu binutils-x86-64-linux-gnu"},
            {"target":"aarch64-linux-gnu","os":"ubuntu-latest","goos":"linux","goarch":"arm64","rust_target":"aarch64-unknown-linux-gnu","binary_suffix":"linux-aarch64","gcc_pkg":"gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu"},
            {"target":"riscv64-linux-gnu","os":"ubuntu-latest","goos":"linux","goarch":"riscv64","rust_target":"riscv64gc-unknown-linux-gnu","binary_suffix":"linux-riscv64","gcc_pkg":"gcc-riscv64-linux-gnu g++-riscv64-linux-gnu binutils-riscv64-linux-gnu"},
            {"target":"aarch64-apple-darwin","os":"macos-latest","goos":"darwin","goarch":"arm64","rust_target":"aarch64-apple-darwin","binary_suffix":"macos-aarch64"},
            {"target":"x86_64-pc-windows-msvc","os":"windows-2022","goos":"windows","goarch":"amd64","rust_target":"x86_64-pc-windows-msvc","binary_suffix":"win-x86_64"}
          ]}
          EOF

          echo "full=$full" >> "$GITHUB_OUTPUT"
          {
            echo "matrix<<MATRIX_EOF"
            if [ "$full" = true ]; then cat /tmp/matrix-full.json; else cat /tmp/matrix-light.json; fi
            echo "MATRIX_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.binary_suffix }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: clean-space
        if: runner.os == 'Linux'
        run: |-
          sudo swapoff -a
          sudo rm -rf /swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean
          sudo df -Th

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false

      - name: Set up Rust toolchain
        run: rustup target add ${{ matrix.rust_target }}

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fix GNU link clash on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f /usr/bin/link.exe

      - name: Install system build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |-
          sudo apt-get update
          sudo apt-get install -y make git gn ninja-build python3 python3-pip libgtk-3-dev gcc rustc ${{ matrix.gcc_pkg }}

      - name: Set up native deps (msquic/webrtc prebuilt + pinned headers)
        id: deps
        uses: ./.github/actions/setup-deps
        with:
          target: ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Compile GT single target (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |-
          make release_target \
            TARGET=${{ matrix.target }} \
            GOOS=${{ matrix.goos }} \
            GOARCH=${{ matrix.goarch }} \
            RUST_TARGET=${{ matrix.rust_target }} \
            BINARY_SUFFIX=${{ matrix.binary_suffix }} \
            MSQUIC_MODE=${{ steps.deps.outputs.msquic-mode }} \
            WEBRTC_MODE=${{ steps.deps.outputs.webrtc-mode }}

      - name: Build GT core library (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |-
          cd ./core && \
          TARGET=${{ matrix.target }} \
          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          RUST_TARGET=${{ matrix.rust_target }} \
          MSQUIC_MODE=prebuilt \
          WEBRTC_MODE=prebuilt \
          make release_lib

      - name: Compile GT single target (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |-
          cargo build --target ${{ matrix.rust_target }} -r
          mkdir -p release
          cp "target/${{ matrix.rust_target }}/release/gt.exe" "release/gt-${{ matrix.binary_suffix }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gt-${{ matrix.binary_suffix }}
          path: |
            release/*

  docker:
    name: docker build and push
    runs-on: ubuntu-latest
    needs: [plan, build]
    if: needs.plan.outputs.full == 'true' && github.event_name != 'pull_request'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download all GT matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gt-linux-*
          path: release
          merge-multiple: true

      - name: List merged release files
        run: ls -la release/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - run: echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
        shell: bash

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          flavor: |
            prefix=server-

      - name: Build and push Docker image for Server
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile-server
          provenance: false

      - name: Extract Docker metadata for Client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          flavor: |
            prefix=client-

      - name: Build and push Docker image for Client
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile-client
          provenance: false

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [plan, build]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    timeout-minutes: 20
    steps:
      - name: Resolve release tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: gt-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum gt-* > checksums.txt
          cat checksums.txt

      - name: Ensure release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |-
          tag="${{ steps.vars.outputs.release_tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/gt-* dist/checksums.txt --clobber
          elif echo "$tag" | grep -qE -- '-(rc|alpha|beta|pre)'; then
            gh release create "$tag" --title "$tag" --notes "G-Tunnel release $tag" --prerelease
            gh release upload "$tag" dist/gt-* dist/checksums.txt
          else
            gh release create "$tag" --title "$tag" --notes "G-Tunnel release $tag" --latest
            gh release upload "$tag" dist/gt-* dist/checksums.txt
          fi
