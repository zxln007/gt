name: test

# Core integration tests. Runs the full ./test package (relay tunneling +
# WebRTC P2P signaling/forward/renegotiation).
#
# Trigger model (see build.yml for the build/release pipeline):
#   push dev/master, PR -> dev/master : Linux core tests
#   website/docs-only pushes are skipped via paths-ignore

on:
  push:
    branches: [ "dev", "master" ]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "dev", "master" ]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: core tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false

      - name: Install system build dependencies
        run: |-
          sudo apt-get update
          sudo apt-get install -y make g++ binutils gn ninja-build python3 python3-pip

      - name: Set up native deps (msquic/webrtc prebuilt + pinned headers)
        id: deps
        uses: ./.github/actions/setup-deps
        with:
          target: x86_64-linux-gnu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # //go:embed dist/* needs at least one file; the tests don't serve the UI
      - name: Placeholder web dist
        run: |-
          mkdir -p core/client/web/dist core/server/web/dist
          echo "ci-placeholder" | tee core/client/web/dist/index.html core/server/web/dist/index.html >/dev/null

      - name: Run core tests
        run: |-
          cd core
          make test-prebuilt TESTFLAGS='-timeout 900s -v'
