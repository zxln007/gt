name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish binaries to (created if missing)"
        required: true
        default: "v2.3.0"
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PREBUILT_REPO: zxln007/gt
  MSQUIC_TAG: msquic-prebuilt
  WEBRTC_TAG: webrtc-prebuilt

jobs:
  build:
    name: build ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────────
          - slug: linux-x86_64
            os: ubuntu-latest
            target: x86_64-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            cc: cc
            cxx: c++
            apt: ""
          - slug: linux-aarch64
            os: ubuntu-latest
            target: aarch64-linux-gnu
            rust_target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            apt: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
          - slug: linux-riscv64
            os: ubuntu-latest
            target: riscv64-linux-gnu
            rust_target: riscv64gc-unknown-linux-gnu
            goos: linux
            goarch: riscv64
            cc: riscv64-linux-gnu-gcc
            cxx: riscv64-linux-gnu-g++
            apt: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu binutils-riscv64-linux-gnu
          # ── macOS ──────────────────────────────────────────────
          - slug: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
          - slug: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
          # ── Windows ────────────────────────────────────────────
          - slug: win-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cross toolchain (Linux)
        if: runner.os == 'Linux' && matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        run: |
          rustup update stable
          rustup target add ${{ matrix.rust_target }}

      - name: Set cross linker (Linux)
        if: runner.os == 'Linux' && matrix.cc != 'cc'
        shell: bash
        run: |
          linker_var="CARGO_TARGET_$(echo ${{ matrix.rust_target }} | tr 'a-z-' 'A-Z_')_LINKER"
          echo "${linker_var}=${{ matrix.cc }}" >> "$GITHUB_ENV"

      - name: Download prebuilt msquic / webrtc
        shell: bash
        run: |
          set -eu
          for lib in msquic webrtc; do
            if [ "$lib" = msquic ]; then tag="$MSQUIC_TAG"; else tag="$WEBRTC_TAG"; fi
            url="https://github.com/${PREBUILT_REPO}/releases/download/${tag}/${lib}-${{ matrix.target }}.tar.gz"
            dest="core/prebuilt/${lib}/${{ matrix.target }}"
            mkdir -p "$dest"
            echo ">> fetching ${url}"
            curl -fSL "$url" | tar -C "$dest" -xz
            test -f "$dest/metadata.json"
          done

      - name: Build core c-archive
        shell: bash
        run: |-
          make -C core release_lib \
            TARGET=${{ matrix.target }} \
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            MSQUIC_MODE=prebuilt WEBRTC_MODE=prebuilt

      - name: Build gt binary
        shell: bash
        run: cargo build --target ${{ matrix.rust_target }} --release

      - name: Stage artifact
        shell: bash
        run: |-
          mkdir -p release
          if [ "${{ matrix.goos }}" = windows ]; then
            cp "target/${{ matrix.rust_target }}/release/gt.exe" "release/gt-${{ matrix.slug }}.exe"
          else
            cp "target/${{ matrix.rust_target }}/release/gt" "release/gt-${{ matrix.slug }}"
          fi
          ls -la release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gt-${{ matrix.slug }}
          path: release/gt-${{ matrix.slug }}*

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Resolve release tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release_tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: gt-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum gt-* > checksums.txt
          cat checksums.txt

      - name: Ensure release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |-
          tag="${{ steps.vars.outputs.release_tag }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --notes "G-Tunnel release $tag" --latest
          gh release upload "$tag" dist/gt-* dist/checksums.txt --clobber
