<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档 - G-Tunnel</title>
  <meta name="description" content="G-Tunnel 文档:快速开始、使用实例(网页发布、SSH、P2P 直连、QUIC、TLS)与完整配置参考。">
  <link rel="alternate" hreflang="en" href="https://gtunnel.dev/docs/">
  <link rel="alternate" hreflang="zh" href="https://gtunnel.dev/zh/docs/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1113'/%3E%3Ccircle cx='7.5' cy='16' r='3' fill='%2335c77e'/%3E%3Ccircle cx='24.5' cy='16' r='3' fill='%2335c77e'/%3E%3Crect x='12' y='15.2' width='8' height='1.6' fill='%2335c77e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../docs/theme.css">
</head>
<body>
  <div id="app"></div>

  <a class="lang-switch" href="/docs/" lang="en" aria-label="Switch to English docs">English</a>

  <script>
    window.$docsify = {
      el: '#app',
      name: 'G-Tunnel 文档',
      nameLink: '/zh/',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      themeColor: '#35c77e',
      notFound: {
        title: '页面不存在',
        body: '这个页面不存在。请从侧栏选择章节,或返回[首页](/zh/)。'
      },
      search: {
        depth: 2,
        hideOtherSidebarContent: true,
        namespace: 'gt-docs-zh',
        placeholder: '搜索文档...',
        noData: '没有找到相关内容'
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      }
    };
  </script>
  <!-- docsify 自带 Prism core 并暴露 window.Prism;下列语法组件依赖它,必须排在 docsify.min.js 之后 -->
  <script src="../../docs/vendor/docsify.min.js"></script>
  <script src="../../docs/vendor/prism-bash.min.js"></script>
  <script src="../../docs/vendor/prism-yaml.min.js"></script>
  <script src="../../docs/vendor/prism-json.min.js"></script>
  <script src="../../docs/vendor/prism-go.min.js"></script>
  <script src="../../docs/vendor/prism-rust.min.js"></script>
  <script src="../../docs/vendor/prism-docker.min.js"></script>
  <script src="../../docs/vendor/search.min.js"></script>
  <script src="../../docs/vendor/docsify-copy-code.min.js"></script>
  <style>
    .lang-switch {
      position: fixed; top: 14px; right: 18px; z-index: 40;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(21, 24, 27, .86); border: 1px solid #262b2f;
      color: #8a9197; font: 500 13px/1.2 system-ui, sans-serif; text-decoration: none;
    }
    .lang-switch:hover { color: #e9ecee; text-decoration: none; }
  </style>
</body>
</html>
