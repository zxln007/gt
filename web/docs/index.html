<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docs - G-Tunnel</title>
  <meta name="description" content="G-Tunnel documentation: quick start, usage examples (web publishing, SSH, P2P, QUIC, TLS), and full configuration reference for the gt relay proxy.">
  <link rel="alternate" hreflang="en" href="https://gtunnel.dev/docs/">
  <link rel="alternate" hreflang="zh" href="https://gtunnel.dev/zh/docs/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1113'/%3E%3Ccircle cx='7.5' cy='16' r='3' fill='%2335c77e'/%3E%3Ccircle cx='24.5' cy='16' r='3' fill='%2335c77e'/%3E%3Crect x='12' y='15.2' width='8' height='1.6' fill='%2335c77e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./theme.css">
</head>
<body>
  <div id="app"></div>

  <a class="lang-switch" href="/zh/docs/" lang="zh-CN" aria-label="切换到中文文档">中文</a>

  <script>
    window.$docsify = {
      el: '#app',
      name: 'G-Tunnel Docs',
      nameLink: '/',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      themeColor: '#35c77e',
      notFound: {
        title: 'Page not found',
        body: 'This page does not exist. Pick a section from the sidebar, or head back to the [homepage](/).'
      },
      search: {
        depth: 2,
        hideOtherSidebarContent: true,
        namespace: 'gt-docs-en',
        placeholder: 'Search docs...',
        noData: 'No results'
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    };
  </script>
  <!-- docsify bundles the Prism core and exposes window.Prism; grammar files below register onto it, so they must load after docsify.min.js -->
  <script src="./vendor/docsify.min.js"></script>
  <script src="./vendor/prism-bash.min.js"></script>
  <script src="./vendor/prism-yaml.min.js"></script>
  <script src="./vendor/prism-json.min.js"></script>
  <script src="./vendor/prism-go.min.js"></script>
  <script src="./vendor/prism-rust.min.js"></script>
  <script src="./vendor/prism-docker.min.js"></script>
  <script src="./vendor/search.min.js"></script>
  <script src="./vendor/docsify-copy-code.min.js"></script>
  <style>
    .lang-switch {
      position: fixed; top: 14px; right: 18px; z-index: 40;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(21, 24, 27, .86); border: 1px solid #262b2f;
      color: #8a9197; font: 500 13px/1.2 system-ui, sans-serif; text-decoration: none;
    }
    .lang-switch:hover { color: #e9ecee; text-decoration: none; }
  </style>
</body>
</html>
